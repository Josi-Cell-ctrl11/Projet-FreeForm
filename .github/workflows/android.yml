name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer le SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler, tester et analyser
        run: gradle --no-daemon testDebugUnitTest testReleaseUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Préparer l’aperçu et les entrées de signature
        run: |
          mkdir -p dist/preview dist/signing-inputs
          cp app/build/outputs/apk/debug/app-debug.apk dist/preview/FloatX-1.0.2-preview.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/signing-inputs/FloatX-1.0.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/signing-inputs/
          if [ -f "$ANDROID_HOME/build-tools/35.0.0/NOTICE" ]; then cp "$ANDROID_HOME/build-tools/35.0.0/NOTICE" dist/signing-inputs/TOOLCHAIN-NOTICE.txt; fi
      - name: APK d’aperçu, signature de test
        uses: actions/upload-artifact@v4
        with:
          name: FloatX-apercu
          path: dist/preview/
          retention-days: 14
      - name: Entrées de signature, APK non installable
        uses: actions/upload-artifact@v4
        with:
          name: FloatX-signing-inputs
          path: dist/signing-inputs/
          retention-days: 3
      - name: Rapports de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-validation
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
