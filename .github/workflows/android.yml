name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Installer le SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compiler, tester et analyser
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Préparer l’APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FloatX-0.4.4-debug.apk
          cd dist
          sha256sum FloatX-0.4.4-debug.apk > SHA256SUMS.txt
      - name: Télécharger l’APK depuis les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: FloatX-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Rapports de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-validation
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
